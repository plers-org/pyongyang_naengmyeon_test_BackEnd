  <script>
    window.onload = () => SwaggerUIBundle({
      spec: {"openapi":"3.1.0","info":{"title":"평양냉면 취향 추천 서비스","description":"\n6문항짜리 취향 테스트로 사용자의 평양냉면 취향을 판정하고, 그 취향에 맞는 가게를 추천하는 API입니다.\n\n## 어떤 화면에서 쓰나\n\n취향 테스트 페이지 하나를 그리는 데 필요한 전부입니다. 화면 흐름은 세 단계입니다.\n\n1. **시작 화면** — 사용자가 \"입문자 / 경험자\" 중 하나를 고릅니다.\n2. **문항 화면** — `GET /api/recommendation/questions/{experience_level}` 로 6문항을 받아 한 문항씩 보여주고, 선택한 답을 프론트가 모아둡니다.\n3. **결과 화면** — 6문항을 모두 답하면 `POST /api/recommendation/submit` 으로 한 번에 제출합니다. 응답 하나에 결과 화면을 그릴 재료가 전부 들어 있습니다.\n\n제출 응답에는 그 결과의 영구 주소인 `result_id` 가 함께 옵니다. 결과 페이지 URL에 이 값을 넣어두면\n`GET /api/recommendation/results/{result_id}` 로 언제든 같은 결과를 다시 받을 수 있습니다.\n\n- **새로고침·뒤로가기에도 결과가 남습니다.** 답변을 다시 제출할 필요가 없습니다.\n- **서버 사이드 렌더링이 됩니다.** 조회가 `GET` 이라 Next.js 서버 컴포넌트에서 그대로 호출할 수 있습니다.\n- **링크만 보내면 공유가 끝납니다.** 받는 사람은 테스트를 풀지 않아도 같은 결과를 봅니다.\n\n조회 응답은 제출 응답과 형태가 완전히 같아서, 결과 화면 컴포넌트를 하나만 두면 됩니다.\n\n문항을 하나씩 서버에 보낼 필요는 없습니다. 프론트가 답을 모았다가 마지막에 한 번만 제출하는 구조입니다.\n\n## 무엇을 판정하나\n\n답변을 4개의 맛 축으로 환산해 취향 유형을 정합니다.\n\n| 축 | 뜻 |\n| --- | --- |\n| `meat_aroma` | 육향 — 고기 향이 얼마나 진한가 |\n| `umami` | 감칠맛 |\n| `buckwheat_aroma` | 메밀향 |\n| `acidity` | 산미 — 새콤하고 개운한 정도 |\n\n각 축은 1~5점이며, 이 점수로 아래 4가지 유형 중 가장 가까운 하나를 대표 유형으로 정합니다.\n\n| 유형 키 | 이름 | 성격 |\n| --- | --- | --- |\n| `uraeok` | 우래옥형 | 진한 고기 향과 깊은 감칠맛 |\n| `uijeongbu` | 의정부형 | 맑고 담백한 육수 |\n| `jangchungdong` | 장충동형 | 메밀 향이 도드라지는 면 중심 |\n| `dongchimi` | 동치미형 | 새콤하고 개운한 끝맛 |\n\n## 알아둘 점\n\n- **인증이 없습니다.** API 키나 토큰 없이 바로 호출하면 됩니다.\n- **CORS가 모든 출처에 열려 있습니다.** 로컬 개발 서버에서 바로 붙일 수 있습니다.\n- **로그인이 없습니다.** 제출 시 넣는 `session_id` 는 프론트가 만든 익명 식별자이며, 유형 분포 통계에만 쓰입니다. 개인정보를 담아서는 안 됩니다.\n- **`result_id` 를 아는 사람은 누구나 결과를 볼 수 있습니다.** 공유가 목적인 설계입니다. 결과에는 개인정보가 없고, `session_id` 는 조회 응답에 실리지 않습니다.\n- **결과는 불변입니다.** 한 번 발급된 `result_id` 의 판정 결과는 이후 로직이나 가게 데이터가 바뀌어도 그대로입니다.\n- **현재 서버는 `http` 입니다.** https 페이지에서 호출하면 브라우저가 차단하므로, 로컬 개발은 `http://localhost` 에서 진행하세요.\n","version":"1.0.0"},"paths":{"/api/recommendation/questions/{experience_level}":{"get":{"tags":["recommendation"],"summary":"취향 테스트 문항 6개 받아오기","description":"**언제 호출하나** — 사용자가 시작 화면에서 입문자/경험자를 고른 직후, 테스트당 한 번만 호출합니다.\n\n**무엇이 오나** — 6개 문항이 한 번에 옵니다. 문항마다 4개의 선택지가 들어 있고, `question_id`(1~6)와 `choice_id`(1~4)는 나중에 답을 제출할 때 그대로 다시 보내야 하는 값입니다.\n\n문항을 하나씩 요청하는 API는 없습니다. 받아온 6문항을 프론트가 순서대로 보여주면서 사용자의 선택을 모아두었다가, 마지막에 `POST /api/recommendation/submit` 으로 한 번에 제출하세요.\n\n`progress` 는 그 문항까지 왔을 때의 진행률(%)이라 진행 바에 그대로 쓸 수 있습니다. (1번 문항 16.7 → 6번 문항 100.0)\n\n**두 문항 세트의 차이** — 문항 수와 구조는 같고 표현만 다릅니다. `beginner` 는 평양냉면이 처음인 사람도 답할 수 있게 일반적인 음식 취향을 묻고, `expert` 는 육수·면발 같은 용어를 그대로 씁니다.","operationId":"get_recommendation_questions_api_recommendation_questions__experience_level__get","parameters":[{"name":"experience_level","in":"path","required":true,"schema":{"type":"string","description":"문항 세트 종류. `beginner`(평양냉면이 처음인 사용자) 또는 `expert`(먹어본 적 있는 사용자).","examples":["beginner"],"title":"Experience Level"},"description":"문항 세트 종류. `beginner`(평양냉면이 처음인 사용자) 또는 `expert`(먹어본 적 있는 사용자)."}],"responses":{"200":{"description":"Successful Response","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RecommendationQuestionsResponse"}}}},"404":{"description":"`experience_level` 이 `beginner` 도 `expert` 도 아닌 경우","content":{"application/json":{"example":{"detail":"지원하지 않는 경험 수준입니다."}}}},"422":{"description":"Validation Error","content":{"application/json":{"schema":{"$ref":"#/components/schemas/HTTPValidationError"}}}}}}},"/api/recommendation/submit":{"post":{"tags":["recommendation"],"summary":"답변을 제출하고 결과 화면 데이터 받기","description":"**언제 호출하나** — 사용자가 6문항을 모두 답한 뒤 한 번만 호출합니다. 이 API 하나로 취향 유형 판정과 가게 추천이 동시에 끝납니다.\n\n**무엇을 보내나** — 앞서 받아온 문항의 `question_id` 와 사용자가 고른 `choice_id` 짝을 `answers` 배열에 담아 보냅니다. 6문항 전부 채워 보내세요.\n\n**무엇이 오나** — 결과 화면 하나를 그릴 재료가 전부 들어 있어서, 추가 호출이 필요 없습니다.\n\n- `result_id` — 이 결과의 영구 주소입니다. 결과 페이지 URL에 넣어두면 새로고침해도, 남에게 링크를 보내도 `GET /api/recommendation/results/{result_id}` 로 같은 결과를 다시 그릴 수 있습니다. **저장에 실패하면 `null` 이 옵니다.** 이때도 아래 결과는 정상이므로, 이 응답 본문으로 화면을 그리고 공유 버튼만 숨기면 됩니다.\n- `primary_type` — 대표 유형. 제목·부제·배지·설명 문구와 테마 색까지 들어 있어 그대로 화면에 쓰면 됩니다. 문구를 서버에서 내려주므로 프론트에 유형별 텍스트를 하드코딩하지 마세요.\n- `secondary_type` / `farthest_type` — 2순위 유형과 가장 안 맞는 유형. 이름과 캐릭터만 들어 있습니다.\n- `type_scores` — 4개 유형 전체의 일치도. 막대 그래프용입니다.\n- `taste_profile` — 육향·감칠맛·메밀향·산미 4축 점수(1~5). 축 이름(`label`)도 함께 오므로 그래프 축 이름을 프론트에 적어둘 필요가 없습니다.\n- `recommended_restaurants` — 추천 가게 2곳. 순위, 추천 이유 문장, 주소, 지도 링크가 들어 있습니다.\n\n**가게가 없을 수 있습니다** — `status` 가 `no_recommendation` 이면 `recommended_restaurants` 가 빈 배열로 오고 `message` 에 안내 문구가 담깁니다. 이때도 유형 판정과 취향 그래프는 정상적으로 채워지므로, 가게 목록 영역만 비우고 나머지 결과는 그대로 보여주면 됩니다.\n\n**`session_id` 는 선택입니다** — 프론트가 만든 익명 UUID를 넣으면 같은 사용자의 응답을 묶어 유형 분포를 집계할 수 있습니다. 로그인과 무관하며 개인정보를 넣어서는 안 됩니다. 생략해도 결과는 같습니다. `result_id` 와는 다른 값이며, `session_id` 로 결과를 조회할 수는 없습니다.","operationId":"submit_recommendation_api_recommendation_submit_post","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/RecommendationSubmitRequest"}}},"required":true},"responses":{"200":{"description":"Successful Response","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RecommendationResultResponse"}}}},"422":{"description":"Validation Error","content":{"application/json":{"schema":{"$ref":"#/components/schemas/HTTPValidationError"}}}}}}},"/api/recommendation/results/{result_id}":{"get":{"tags":["recommendation"],"summary":"발급받은 결과 ID로 결과 화면 데이터 다시 받기","description":"**언제 호출하나** — 결과 페이지가 열릴 때마다 호출합니다. 본인이 방금 제출한 경우든, 공유 링크를 받고 들어온 다른 사람이든 동일합니다.\n\n**무엇을 보내나** — `POST /api/recommendation/submit` 응답의 `result_id` 를 경로에 그대로 넣습니다. 답변을 다시 보낼 필요가 없어 **서버 컴포넌트에서 그대로 호출**할 수 있습니다.\n\n**무엇이 오나** — `submit` 과 **완전히 같은 형태**의 응답입니다. 결과 화면 컴포넌트를 하나만 두고 두 API의 응답을 같은 타입으로 다루면 됩니다.\n\n**같은 ID는 항상 같은 결과** — 유형 판정·취향 점수·추천 가게는 제출 시점에 저장된 값을 그대로 돌려줍니다. 그 뒤 추천 로직이나 가게 데이터가 바뀌어도 이미 공유된 결과는 달라지지 않습니다. 다만 유형 카피(`title`·`reason` 등)와 축 이름은 조회 시점의 최신 문구로 조립되므로, 문구 오타를 고치면 기존 링크에도 반영됩니다.\n\n**응답은 캐시해도 됩니다** — 결과가 불변이라 `Cache-Control: public, max-age=3600` 이 함께 옵니다.","operationId":"get_recomm
